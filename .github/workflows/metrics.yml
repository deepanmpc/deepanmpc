name: GitHub Metrics

on:
  # Schedule daily updates at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual workflow dispatch from GitHub Actions tab
  workflow_dispatch:
  # Run when pushing to the main/master branch
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: deepanmpc
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata # Change to your local timezone

          # Isometric 3D calendar plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most used languages plugin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%